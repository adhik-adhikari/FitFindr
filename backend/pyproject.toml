[project]
name = "fitfindr-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.17,<2",
    "fastapi>=0.135,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.12,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn>=0.41,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9,<10",
    "ruff>=0.15,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires an isolated PostgreSQL test database"]

[tool.ruff]
target-version = "py311"
