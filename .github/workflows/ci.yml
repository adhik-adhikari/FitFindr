name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fitfindr_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fitfindr_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      FITFINDR_ALLOW_DESTRUCTIVE_TEST_DATABASE: fitfindr_test_is_disposable
      FITFINDR_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fitfindr_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.13
      - run: uv sync --locked --dev --python 3.13
      - run: uv run ruff check .
      - name: Require PostgreSQL integration test configuration
        run: >-
          test -n "$FITFINDR_TEST_DATABASE_URL" &&
          test "$FITFINDR_ALLOW_DESTRUCTIVE_TEST_DATABASE" =
          "fitfindr_test_is_disposable"
      - run: uv run pytest
